<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prarambha Account &amp; Stock Management - Login</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="shortcut icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/login.css?v=3">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <!-- Logo -->
            <div class="login-logo">
                <svg viewBox="0 0 1024 1024" width="64" height="64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!-- ============================================================
       Prarambha Account & Stock Management — App Icon
       Concept: a rising sun (Prarambha = "new beginning / dawn")
       rising behind three ascending growth bars (accounts & stock).
       Palette matches the app theme: deep navy + green accent + gold.
       ============================================================ -->
  <defs>
    <!-- Badge background — deep navy gradient (app sidebar / login theme) -->
    <linearGradient id="pb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22365e"/>
      <stop offset="52%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <!-- Soft top sheen for depth -->
    <radialGradient id="pb-sheen" cx="0.5" cy="0.32" r="0.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Rising sun (dawn / new beginning) -->
    <linearGradient id="pb-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd27a"/>
      <stop offset="55%" stop-color="#f6a623"/>
      <stop offset="100%" stop-color="#e67e22"/>
    </linearGradient>
    <!-- Growth bars (accounts / stock levels) -->
    <linearGradient id="pb-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1e8e4e"/>
      <stop offset="100%" stop-color="#34d17b"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square badge -->
  <rect x="24" y="24" width="976" height="976" rx="212" fill="url(#pb-bg)"/>
  <rect x="24" y="24" width="976" height="976" rx="212" fill="url(#pb-sheen)"/>
  <rect x="24" y="24" width="976" height="976" rx="212" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Dawn glow behind the sun (soft — scales cleanly to any size) -->
  <circle cx="512" cy="452" r="312" fill="url(#pb-sun)" opacity="0.09"/>
  <circle cx="512" cy="452" r="222" fill="url(#pb-sun)" opacity="0.13"/>

  <!-- Sun -->
  <circle cx="512" cy="452" r="126" fill="url(#pb-sun)"/>
  <circle cx="512" cy="420" r="54" fill="#ffe9b0" opacity="0.32"/>

  <!-- Ground shadow -->
  <ellipse cx="512" cy="772" rx="330" ry="12" fill="#000000" opacity="0.25"/>

  <!-- Growth bars (ascending, sitting on the baseline at y=740) -->
  <g>
    <rect x="223" y="582" width="150" height="158" rx="22" fill="url(#pb-bar)"/>
    <rect x="437" y="498" width="150" height="242" rx="22" fill="url(#pb-bar)"/>
    <rect x="651" y="414" width="150" height="326" rx="22" fill="url(#pb-bar)"/>
    <rect x="205" y="740" width="614" height="14" rx="7" fill="#ffffff" opacity="0.16"/>
  </g>
</svg>
            </div>

            <h1 class="login-title" id="formTitle">Prarambha Account &amp; Stock Management</h1>
            <p class="login-subtitle" id="formSubtitle">Account &amp; Stock Management System</p>

            <!-- ========== LOGIN FORM ========== -->
            <div id="loginView">
                <form id="loginForm" class="login-form" autocomplete="off">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" class="form-control" placeholder="Enter your username" required autofocus autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
                    </div>
                    <label class="remember-me-label">
                        <input type="checkbox" id="rememberMe" class="remember-me-checkbox">
                        <span class="remember-me-text">Remember me for 30 days</span>
                    </label>
                    <button type="submit" class="login-btn" id="loginBtn">
                        <span class="login-btn-text">Sign In</span>
                        <span class="login-btn-spinner" style="display:none">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10" stroke-dasharray="31.4 31.4" stroke-linecap="round">
                                    <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1s" repeatCount="indefinite"/>
                                </circle>
                            </svg>
                        </span>
                    </button>
                    <div id="loginError" class="login-error" style="display:none"></div>
                </form>

                <div class="login-links">
                    <span class="login-link" style="opacity:.5;cursor:default">Forgot Password?</span>
                    <span class="login-link" style="opacity:.5;cursor:default">Create New Account</span>
                </div>
            </div>

            <!-- ========== REGISTER FORM ========== -->
            <div id="registerView" style="display:none">
                <form id="registerForm" class="login-form" autocomplete="off">
                    <div class="form-group">
                        <label for="regUsername">Choose a Username</label>
                        <input type="text" id="regUsername" class="form-control" placeholder="At least 3 characters" required minlength="3" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Choose a Password</label>
                        <input type="password" id="regPassword" class="form-control" placeholder="At least 4 characters" required minlength="4" autocomplete="new-password">
                    </div>
                    <button type="submit" class="login-btn" id="registerBtn">
                        <span class="login-btn-text">Create Account</span>
                        <span class="login-btn-spinner" style="display:none">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10" stroke-dasharray="31.4 31.4" stroke-linecap="round">
                                    <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1s" repeatCount="indefinite"/>
                                </circle>
                            </svg>
                        </span>
                    </button>
                    <div id="registerError" class="login-error" style="display:none"></div>
                </form>

                <div class="login-links">
                    <a href="#" id="backToLoginFromRegister" class="login-link">← Back to Login</a>
                </div>
            </div>

            <!-- ========== FORGOT PASSWORD FORM ========== -->
            <div id="forgotPasswordView" style="display:none">
                <form id="forgotPasswordForm" class="login-form" autocomplete="off">
                    <div class="auth-info">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="16" x2="12" y2="12"/>
                            <line x1="12" y1="8" x2="12.01" y2="8"/>
                        </svg>
                        <span>Enter your username and a new password to reset.</span>
                    </div>
                    <div class="form-group">
                        <label for="resetUsername">Username</label>
                        <input type="text" id="resetUsername" class="form-control" placeholder="Enter your username" required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="resetPassword">New Password</label>
                        <input type="password" id="resetPassword" class="form-control" placeholder="At least 4 characters" required minlength="4" autocomplete="new-password">
                    </div>
                    <button type="submit" class="login-btn" id="resetBtn">
                        <span class="login-btn-text">Reset Password</span>
                        <span class="login-btn-spinner" style="display:none">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10" stroke-dasharray="31.4 31.4" stroke-linecap="round">
                                    <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1s" repeatCount="indefinite"/>
                                </circle>
                            </svg>
                        </span>
                    </button>
                    <div id="resetError" class="login-error" style="display:none"></div>
                </form>

                <div class="login-links">
                    <a href="#" id="backToLoginFromReset" class="login-link">← Back to Login</a>
                </div>
            </div>

            <div class="login-footer">
                <p>Prarambha Account &amp; Stock Management v1.0.0</p>
                <p class="login-hint">Default: admin / admin123 — change it after first login</p>
            </div>
        </div>
    </div>

    <script src="js/login.js?v=3"></script>
</body>
</html>
