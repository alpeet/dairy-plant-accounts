<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- ============================================================
       Prarambha Account & Stock Management — App Icon
       Concept: a rising sun (Prarambha = "new beginning / dawn")
       rising behind three ascending growth bars (accounts & stock).
       Palette matches the app theme: deep navy + green accent + gold.
       ============================================================ -->
  <defs>
    <!-- Badge background — deep navy gradient (app sidebar / login theme) -->
    <linearGradient id="pb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22365e"/>
      <stop offset="52%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <!-- Soft top sheen for depth -->
    <radialGradient id="pb-sheen" cx="0.5" cy="0.32" r="0.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Rising sun (dawn / new beginning) -->
    <linearGradient id="pb-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd27a"/>
      <stop offset="55%" stop-color="#f6a623"/>
      <stop offset="100%" stop-color="#e67e22"/>
    </linearGradient>
    <!-- Growth bars (accounts / stock levels) -->
    <linearGradient id="pb-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1e8e4e"/>
      <stop offset="100%" stop-color="#34d17b"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square badge -->
  <rect x="24" y="24" width="976" height="976" rx="212" fill="url(#pb-bg)"/>
  <rect x="24" y="24" width="976" height="976" rx="212" fill="url(#pb-sheen)"/>
  <rect x="24" y="24" width="976" height="976" rx="212" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Dawn glow behind the sun (soft — scales cleanly to any size) -->
  <circle cx="512" cy="452" r="312" fill="url(#pb-sun)" opacity="0.09"/>
  <circle cx="512" cy="452" r="222" fill="url(#pb-sun)" opacity="0.13"/>

  <!-- Sun -->
  <circle cx="512" cy="452" r="126" fill="url(#pb-sun)"/>
  <circle cx="512" cy="420" r="54" fill="#ffe9b0" opacity="0.32"/>

  <!-- Ground shadow -->
  <ellipse cx="512" cy="772" rx="330" ry="12" fill="#000000" opacity="0.25"/>

  <!-- Growth bars (ascending, sitting on the baseline at y=740) -->
  <g>
    <rect x="223" y="582" width="150" height="158" rx="22" fill="url(#pb-bar)"/>
    <rect x="437" y="498" width="150" height="242" rx="22" fill="url(#pb-bar)"/>
    <rect x="651" y="414" width="150" height="326" rx="22" fill="url(#pb-bar)"/>
    <rect x="205" y="740" width="614" height="14" rx="7" fill="#ffffff" opacity="0.16"/>
  </g>
</svg>
